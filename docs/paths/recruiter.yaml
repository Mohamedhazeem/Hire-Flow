        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ValidationErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml

  /api/recruiter/jobs/{id}/applicants/export:
    get:
      tags: [recruiter]
      operationId: recruiterExportApplicantsCsv
      summary: Export applicants as CSV
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Job ID (CUID)
            example: clxxx
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: CSV file stream
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml

