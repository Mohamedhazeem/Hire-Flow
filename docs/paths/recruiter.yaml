          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml

  /api/recruiter/applications/{applicationId}/profile:
    get:
      tags: [recruiter]
      operationId: recruiterGetApplicantProfile
      summary: Get minimal applicant profile
      security:
        - sessionAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            description: Application ID (CUID)
            example: clxxx
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: ../schemas/recruiter/ProfileMinimalResponse.yaml
        '401':
