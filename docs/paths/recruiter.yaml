  /api/recruiter/applications/{applicationId}/status:
    patch:
      tags: [recruiter]
      operationId: recruiterTransitionApplicationStatus
      summary: Transition application status
      security:
        - sessionAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            description: Application ID (CUID)
            example: clxxx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/recruiter/StatusTransitionRequest.yaml
      responses:
        '200':
          description: Status transitioned successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [success, status]
                    properties:
                      success:
                        type: boolean
                        example: true
                      status:
                        type: string
                        example: shortlisted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '409':
          description: Conflict (concurrency or invalid transition)
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ValidationErrorResponse.yaml
        '500':
