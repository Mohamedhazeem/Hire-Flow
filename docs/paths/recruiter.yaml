              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ValidationErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml

  /api/recruiter/jobs/{id}/analytics:
