        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ValidationErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml

  /api/recruiter/jobs/{id}/applicants:
    get:
      tags: [recruiter]
      operationId: recruiterListApplicants
      summary: List applicants for a job
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Job ID (CUID)
            example: clxxx
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: ../schemas/shared/enums/ApplicationStatus.yaml
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [appliedAt, updatedAt, status]
            default: appliedAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
