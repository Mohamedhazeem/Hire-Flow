          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            description: Comma-separated application statuses
        - name: workMode
          in: query
          schema:
            $ref: ../schemas/shared/enums/WorkMode.yaml
        - name: employmentType
          in: query
          schema:
            $ref: ../schemas/shared/enums/EmploymentType.yaml
        - name: location
          in: query
          schema:
            type: string
            description: Comma-separated locations
      responses:
        '200':
          description: Successful response
          content:
