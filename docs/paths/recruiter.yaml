openapi: 3.0.3
info:
  title: Hire Flow Recruiter API
  version: 1.0.0
  description: Modular OpenAPI specification for the recruiter API group.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/recruiter/jobs:
    get:
      tags: [recruiter]
      operationId: recruiterListJobs
      summary: List jobs for the recruiter's company
      security:
        - sessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, archived, all]
            default: all
        - name: workMode
          in: query
          schema:
            $ref: ../schemas/shared/enums/WorkMode.yaml
        - name: employmentType
          in: query
          schema:
            $ref: ../schemas/shared/enums/EmploymentType.yaml
        - name: experienceLevel
          in: query
          schema:
            type: string
        - name: skills
          in: query
          explode: true
          style: form
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [title, createdAt, updatedAt, viewCount, status]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: ../schemas/recruiter/JobListResponse.yaml
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ValidationErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
    post:
      tags: [recruiter]
      operationId: recruiterCreateJob
      summary: Create a new job
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/recruiter/JobCreateRequest.yaml
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [job]
                    properties:
                      job:
                        $ref: ../schemas/recruiter/Job.yaml
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ValidationErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml

  /api/recruiter/jobs/{id}:
    get:
      tags: [recruiter]
      operationId: recruiterGetJob
      summary: Get job by ID or slug
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Job ID or slug (CUID)
            example: clxxx
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [job]
                    properties:
                      job:
                        $ref: ../schemas/recruiter/Job.yaml
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
    patch:
      tags: [recruiter]
      operationId: recruiterUpdateJob
      summary: Update a job
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Job ID (CUID)
            example: clxxx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/recruiter/JobUpdateRequest.yaml
      responses:
        '200':
          description: Job updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [job]
                    properties:
                      job:
                        $ref: ../schemas/recruiter/Job.yaml
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ValidationErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
    delete:
      tags: [recruiter]
      operationId: recruiterDeleteJob
      summary: Delete or archive a job
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: Job ID (CUID)
            example: clxxx
        - name: force
          in: query
          schema:
            type: boolean
            description: Force hard delete even if not draft
      responses:
        '200':
          description: Job deleted or archived successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: ../schemas/recruiter/DeleteJobResponse.yaml
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: ../schemas/shared/ErrorResponse.yaml

  /api/recruiter/jobs/{id}/toggle:
    patch:
      tags: [recruiter]
