openapi: 3.0.3
info:
  title: Hire Flow Auth API
  description: |
    Better Auth REST surface exposed by the catch-all at /api/auth/[...all]/route.ts.
    Endpoints are documented from the plugins and routes configured in
    app/features/auth/libs/auth.ts (email/password, email verification, Google OAuth,
    admin plugin, nextCookies).
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/auth/sign-up/email:
    post:
      tags: [auth]
      operationId: authSignUpEmail
      summary: Register a new user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/auth/SignUpRequest.yaml'
      responses:
        '200':
          description: Account created (auto sign-in enabled via email verification plugin)
          content:
            application/json:
              schema:
                $ref: '../schemas/auth/UserAuth.yaml'
        '201':
          description: Account created successfully
        '400':
          description: Validation error or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ValidationErrorResponse.yaml'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'

  /api/auth/sign-in/email:
    post:
      tags: [auth]
      operationId: authSignInEmail
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/auth/SignInRequest.yaml'
      responses:
        '200':
          description: Signed in — session cookie set
          content:
            application/json:
              schema:
                $ref: '../schemas/auth/UserAuth.yaml'
        '400':
          description: Invalid credentials or validation error
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ValidationErrorResponse.yaml'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'

  /api/auth/sign-in/google:
    post:
      tags: [auth]
      operationId: authSignInGoogle
      summary: Initiate Google OAuth sign-in (returns redirect or token payload)
      responses:
        '200':
          description: OAuth flow response (redirect URL or token)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: OAuth configuration error
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'

  /api/auth/session:
    get:
      tags: [auth]
      operationId: authGetSession
      summary: Get the current authenticated session
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Active session returned
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [session, user]
                    properties:
                      session:
                        type: object
                        required:
                          - id
                          - userId
                          - expiresAt
                          - token
                          - createdAt
                          - updatedAt
                        properties:
                          id:
                            type: string
                            example: sess_clxxx001
                          userId:
                            type: string
                            example: clxxx123abc
                          expiresAt:
                            type: string
                            format: date-time
                          token:
                            type: string
                            example: abc-token-hash
                          ipAddress:
                            type: string
                            nullable: true
                          userAgent:
                            type: string
                            nullable: true
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time
                      user:
                        $ref: '../schemas/auth/UserAuth.yaml'
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'

  /api/auth/sign-out:
    post:
      tags: [auth]
      operationId: authSignOut
      summary: Sign out and destroy the session
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Signed out successfully
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: No active session
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'

  /api/auth/forgot-password:
    post:
      tags: [auth]
      operationId: authForgotPassword
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/auth/ForgotPasswordRequest.yaml'
      responses:
        '200':
          description: Reset email dispatched (or suppressed for non-existent email)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ValidationErrorResponse.yaml'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'

  /api/auth/reset-password:
    post:
      tags: [auth]
      operationId: authResetPassword
      summary: Reset password using the token from the email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/auth/ResetPasswordRequest.yaml'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ValidationErrorResponse.yaml'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'

  /api/auth/verify-email:
    get:
      tags: [auth]
      operationId: authGetVerifyEmail
      summary: Verify an email address (auto sign-in after verification)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            example: verif-token-abc
      responses:
        '200':
          description: Email verified and user signed in
          content:
            application/json:
              schema:
                $ref: '../schemas/auth/UserAuth.yaml'
        '400':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ValidationErrorResponse.yaml'

    post:
      tags: [auth]
      operationId: authPostVerifyEmail
      summary: Resend verification email
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
      responses:
        '200':
          description: Verification email re-sent
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ValidationErrorResponse.yaml'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas/shared/ErrorResponse.yaml'
