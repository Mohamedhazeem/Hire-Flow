type: object
description: Recruiter invite row.
required:
  - id
  - email
  - invitedBy
  - createdAt
properties:
  id:
    type: string
  email:
    type: string
    format: email
  invitedBy:
    type: object
    required:
      - name
      - email
    properties:
      name:
        type: string
        nullable: true
      email:
        type: string
  createdAt:
    type: string
    format: date-time
  acceptedAt:
    type: string
    format: date-time
    nullable: true
