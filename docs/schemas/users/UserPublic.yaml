type: object
description: Public user fields returned by GET /api/users/{id}
required:
  - id
  - name
  - role
properties:
  id:
    type: string
    example: clxxx123abc
  name:
    type: string
    example: Jane Doe
  image:
    type: string
    nullable: true
    format: uri
    example: https://cdn.example.com/avatars/jane.jpg
  role:
    $ref: '../shared/enums/Role.yaml'
