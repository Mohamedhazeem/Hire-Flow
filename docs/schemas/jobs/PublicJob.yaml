type: object
description: Lightweight public job row for list responses.
required:
  - id
  - slug
  - title
  - companyId
  - companyName
  - locations
  - workMode
  - employmentType
  - experienceLevel
  - createdAt
properties:
  id:
    type: string
    description: CUID identifier.
    example: "clxxx"
  slug:
    type: string
    nullable: true
    description: URL-friendly slug. May be null for legacy jobs.
    example: "senior-frontend-engineer"
  title:
    type: string
    example: "Senior Frontend Engineer"
  companyId:
    type: string
    description: ID of the owning company.
    example: "clabc"
  companyName:
    type: string
    example: "Acme Corp"
  companyLogo:
    type: string
    nullable: true
    description: URL to the company logo image.
    example: "https://cdn.example.com/logos/acme.png"
  locations:
    type: array
    items:
      type: string
    description: Array of location strings (e.g. cities, "Remote", "Worldwide").
    example:
      - "San Francisco, CA"
      - "Remote"
  workMode:
    $ref: ../shared/enums/WorkMode.yaml
  employmentType:
    $ref: ../shared/enums/EmploymentType.yaml
  salaryMin:
    type: integer
    nullable: true
    description: Minimum annual salary in salaryCurrency. Null if not disclosed.
    example: 120000
  salaryMax:
    type: integer
    nullable: true
    description: Maximum annual salary in salaryCurrency. Null if not disclosed.
    example: 180000
  salaryCurrency:
    type: string
    description: ISO 4217 currency code.
    default: USD
    example: "USD"
  skills:
    type: array
    items:
      type: string
    description: Array of skill tags.
    example:
      - "React"
      - "TypeScript"
      - "Node.js"
  experienceLevel:
    type: string
    description: Free-text experience level (e.g. "Senior", "Mid", "Entry").
    example: "Senior"
  applicationDeadline:
    type: string
    format: date-time
    nullable: true
    description: UTC timestamp when applications close. Null means no deadline.
    example: "2025-12-31T23:59:59Z"
  createdAt:
    type: string
    format: date-time
    description: ISO 8601 timestamp of job creation.
    example: "2025-01-15T10:00:00Z"
