type: object
description: User resume entry within AdminUserDetail
required:
  - id
  - label
  - fileUrl
  - isPrimary
  - createdAt
properties:
  id:
    type: string
    example: clxxx003
  label:
    type: string
    example: Software Engineer Resume 2025
  fileUrl:
    type: string
    nullable: true
    format: uri
    example: https://cdn.example.com/resumes/clxxx003.pdf
  isPrimary:
    type: boolean
    example: true
  createdAt:
    type: string
    format: date-time
