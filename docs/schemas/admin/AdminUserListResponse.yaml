type: object
description: Paginated list of admin users returned by GET /api/admin/users
required:
  - users
  - page
  - pageSize
  - total
  - totalPages
  - hasNextPage
  - hasPrevPage
properties:
  users:
    type: array
    items:
      $ref: './AdminUser.yaml'
  page:
    type: integer
    example: 1
  pageSize:
    type: integer
    example: 20
  total:
    type: integer
    example: 100
  totalPages:
    type: integer
    example: 5
  hasNextPage:
    type: boolean
    example: true
  hasPrevPage:
    type: boolean
    example: false
