openapi: 3.0.3
info:
  title: Hire Flow API
  version: 1.0.0
  description: >-
    Production-grade job board and applicant tracking system (ATS) API for
    Hire Flow. Supports three roles — Admins, Recruiters, and Job Seekers —
    with real-time messaging, AI-powered resume assistance, and a public-facing
    job marketplace.

    ## Conventions

    - All responses are wrapped in a success envelope:
      `{ "success": true, "data": <T> }`. Errors return
      `{ "success": false, "message": "<reason>" }` (HTTP 422 validation errors
      additionally return `{ "error": "Validation failed", "details": {...} }`).
    - Authentication uses Better Auth cookie-based sessions (`sessionAuth`).
      Most endpoints require an authenticated session; the public job
      marketplace and the auth bootstrap flows are anonymous.
    - Pagination is offset-based (`page`, `pageSize`) or cursor-based
      (`cursor`, `limit`) depending on the endpoint; list responses embed the
      pagination metadata directly under `data`.
    - Every write path is validated with Zod before touching the database.
  contact:
    name: Hire Flow
    url: https://github.com/Mohamedhazeem/hire-flow
  license:
    name: Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
servers:
  - url: http://localhost:3000
    description: >-
      Local development server
tags:
  - name: admin
    description: Platform administration (users, jobs, team, messaging, analytics).
  - name: recruiter
    description: Recruiter job posting, applicant pipeline, analytics, and messaging.
  - name: user
    description: Job seeker profile, resumes, applications, and bookmarks.
  - name: jobs
    description: Public job marketplace (listing, detail, apply, related, view).
  - name: users
    description: Resolve a user's public identity by ID.
  - name: auth
    description: Better Auth authentication flows (sign-up, sign-in, session, etc.).
  - name: notifications
    description: Role-aware in-app notifications.
  - name: pusher
    description: Pusher private-channel authentication for realtime messaging.
  - name: files
    description: Auth-guarded file download proxy (resumes, logos, attachments).
  - name: upload
    description: Authenticated file upload and deletion (resume, logo, attachment).
