PageParam:
  name: page
  in: query
  required: false
  description: 1-based page number for offset pagination.
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 1

PageSizeParam:
  name: pageSize
  in: query
  required: false
  description: Number of items per page (capped at 100 by the server).
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    example: 20

CursorParam:
  name: cursor
  in: query
  required: false
  description: Opaque cursor returned by a previous cursor-paginated response.
  schema:
    type: string
    example: clxyz123

LimitParam:
  name: limit
  in: query
  required: false
  description: Maximum number of items to return for cursor pagination (capped at 100).
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    example: 20

SearchParam:
  name: search
  in: query
  required: false
  description: Free-text search filter.
  schema:
    type: string
    example: engineering

SortByParam:
  name: sortBy
  in: query
  required: false
  description: Field to sort by.
  schema:
    type: string
    example: createdAt

SortOrderParam:
  name: sortOrder
  in: query
  required: false
  description: Sort direction.
  schema:
    type: string
    enum:
      - asc
      - desc
    default: desc
    example: desc
